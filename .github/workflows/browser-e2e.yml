name: Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview -- --host 127.0.0.1 > /tmp/apexlab-vite.log 2>&1 &
      - run: npx playwright test e2e/reporting-ui.spec.ts --reporter=line
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            lab-frontend/test-results
            lab-frontend/playwright-report
            /tmp/apexlab-vite.log
          if-no-files-found: ignore
