name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening, saas-production-hardening]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
