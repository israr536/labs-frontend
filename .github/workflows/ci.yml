name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening, saas-production-hardening]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-logs-${{ github.run_id }}
          path: |
            lab-frontend/lint.log
            lab-frontend/build.log
