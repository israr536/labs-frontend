<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PathMLT — Laboratory Reporting Software</title>
  <desc id="desc">Laboratory reporting software for diagnostic labs to manage patients, tests, results and professional reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="40" r="220" fill="#0A84FF" opacity="0.07"/>
  <circle cx="1060" cy="590" r="260" fill="#0055D4" opacity="0.05"/>

  <rect x="70" y="70" width="490" height="490" rx="42" fill="#ffffff" stroke="#d8e7f7" stroke-width="2"/>
  <rect x="112" y="112" width="112" height="112" rx="28" fill="url(#brand)"/>
  <path d="M136 132h64v24l-8 16v30a20 20 0 0 1-20 20h-8a20 20 0 0 1-20-20v-30l-8-16z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M144 174h48v28a16 16 0 0 1-16 16h-16a16 16 0 0 1-16-16z" fill="#ffffff" opacity="0.9"/>
  <rect x="200" y="152" width="14" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="200" y="164" width="14" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
  <rect x="200" y="176" width="10" height="5" rx="2.5" fill="#ffffff" opacity="0.5"/>

  <text x="112" y="286" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#102a43">PathMLT</text>
  <text x="112" y="334" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#52606d">Laboratory reporting software</text>
  <text x="112" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334e68">Patients • Tests • Results • Reports</text>
  <line x1="112" y1="438" x2="500" y2="438" stroke="#d8e7f7" stroke-width="2"/>
  <text x="112" y="482" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#627d98">Built for diagnostic laboratory workflows</text>

  <text x="650" y="230" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#102a43">Modern lab reporting,</text>
  <text x="650" y="292" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#0055D4">made simple.</text>
  <text x="650" y="358" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#52606d">Manage patients, tests, results and</text>
  <text x="650" y="396" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#52606d">professional reports in one workspace.</text>
  <rect x="650" y="452" width="300" height="58" rx="29" fill="#0A84FF"/>
  <text x="800" y="489" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">www.pathmlt.com</text>
